name: hoyo_downloader
description: "Cross-platform miHoYo game package downloader (HoYoPlay API), inspired by Starward."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.5
  convert: ^3.1.1
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  zstandard: ^1.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
