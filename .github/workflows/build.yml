name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.5'

jobs:
  # ---------- Analyze & unit tests, gate for all builds ----------
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ---------- Android APK ----------
  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Optional release signing: configure the four ANDROID_* secrets to sign
      # with your own keystore; otherwise the debug key is used automatically.
      - name: Setup release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Release keystore configured."
          else
            echo "No keystore secrets, falling back to debug signing."
          fi
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      # Shows which certificate actually signed the artifact:
      # release key prints "CN=HoYo Downloader", debug fallback prints "CN=Android Debug".
      - name: Print APK signing certificate
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: hoyo_downloader-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-*-release.apk

  # ---------- Windows ----------
  windows:
    name: Windows
    needs: test
    # windows-latest (windows-2025 image) breaks Flutter's Visual Studio
    # detection (falls back to the "Visual Studio 16 2019" CMake generator
    # and fails); windows-2022 ships VS 2022 with the C++ workload.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Surfaces the detected Visual Studio in the log for troubleshooting.
      - run: flutter doctor -v
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath hoyo_downloader-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hoyo_downloader-windows-x64
          path: hoyo_downloader-windows-x64.zip

  # ---------- Linux ----------
  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tarball
        run: tar -czf hoyo_downloader-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: hoyo_downloader-linux-x64
          path: hoyo_downloader-linux-x64.tar.gz

  # ---------- macOS ----------
  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package zip
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/hoyo_downloader.app hoyo_downloader-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hoyo_downloader-macos
          path: hoyo_downloader-macos.zip

  # ---------- GitHub Release on tag ----------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/hoyo_downloader-android/*.apk
            artifacts/hoyo_downloader-windows-x64/*.zip
            artifacts/hoyo_downloader-linux-x64/*.tar.gz
            artifacts/hoyo_downloader-macos/*.zip
